scheduler:
  timezone: Asia/Shanghai
  misfire_grace_minutes: 600
  cross_day_backfill: false

browser:
  channel: chrome
  headless: false
  locale: zh-CN
  timezone_id: Asia/Shanghai
  keep_open_after_manual_run: true

platforms:
  compass:
    profile_dir: runtime/browser-profile
    # 按各层级分类完整名称跳过；只对抖音生效，例如 ["示例分类"]。
    category_blacklist: []
    # 保留当前抖音历史库，并明确其唯一平台归属。
    database_env: COMPASS_DATABASE_URL
  taobao:
    # 分类路径中任一层级名称命中即跳过；只对淘宝生效。
    category_blacklist:
      - 私处护理
      - 商务用品
      - 商务清洁剂/用品
      - 个护服务
      - 头发清洁护理
      - 头发清洁/护理/造型
      - 其他
      - 身体护理
      - 口腔护理
      - 卫生巾/经期用品
    # 独立目录声明不会启动浏览器或复制其他 Profile 的凭证。
    profile_dir: runtime/taobao-browser-profile
    # 可分发配置使用独立淘宝库，不搬迁本机PoC数据。
    database_env: TAOBAO_DATABASE_URL
    webdriver_compatibility: true
    # 仅淘宝补充原生 Profile 未恢复的会话 Cookie，抖音保持默认关闭。
    persist_session_cookies: true

collection:
  request_interval_seconds:
    min: 0.5
    max: 1
  action_timeout_seconds: 30
  response_timeout_seconds: 45
  scroll_settle_seconds: 1.5
  manual_auth_wait_seconds: 180
  network_retry_attempts: 2

publication:
  web_primary_task_id: compass_household_cleaning_realtime

database:
  url_env: COMPASS_DATABASE_URL

retention:
  raw_response_days: 30
  failure_artifact_days: 10
  log_days: 10
  delete_database_records: false
  delete_exports: false

tasks:
  - id: compass_household_cleaning_realtime
    platform: compass
    enabled: true
    display_name: 个护家清实时榜
    schedule: "0 14 * * *"
    rank:
      type: product_hot_sale
      endpoint_path: /compass_api/shop/product/product_rank/market_hot_sale
      rank_data_type: 1
      activity_id: ""
    category_scope:
      mode: all_level1
      # 只循环个护家清行业下的全部三级分类。
      industry_id: "5"
      target_level: 3
      exclude_all: true
    filters:
      # 已验证：-1 表示不限，0 表示非知名品牌。
      brand_type: -1
      # 已验证：不限表示不限制商品价格带。
      price_bin: "不限"
      search_info: ""
    date:
      strategy: today
      date_type: 1
  - id: taobao_household_cleaning_realtime
    platform: taobao
    # 真实两分类及全根验收完成前不加入默认运行和定时调度。
    enabled: false
    display_name: 淘宝洗护清洁实时榜
    schedule: "0 14 * * *"
    rank:
      type: product_market_rank
      endpoint_path: /mc/mq/mkt/item/live/rank.json
      rank_type: gmv
      page_size: 20
    category_scope:
      mode: all_level1
      root_category_id: "50025705"
      additional_roots:
        # 家庭/个人清洁工具：只追加截图中的三个二级分支。
        - root_category_id: "50016348"
          level2_category_ids:
            - "2132"      # 卫浴/置物用具
            - "50003949"  # 家务/地板清洁用具
            - "50009146"  # 个人洗护清洁用具
      target_level: 3
      exclude_all: true
    filters:
      min_price: ""
      max_price: ""
      price_segment: ""
      seller_type: -1
      keyword: ""
    date:
      strategy: today
      date_type: today
