# 淘宝全量入口默认配置；可通过 CONFIG 显式覆盖。
browser:
  channel: chrome
  headless: false
  locale: zh-CN
  timezone_id: Asia/Shanghai
  # 手动验收结束或失败后保留页面，按Enter或GUI关闭后才释放Profile。
  keep_open_after_manual_run: true
platforms:
  taobao:
    # 分类路径中任一层级名称命中即跳过；去掉首尾空白后精确匹配。
    category_blacklist:
      - 私处护理
      - 商务用品
      - 商务清洁剂/用品
      - 个护服务
      - 头发清洁护理
      - 头发清洁/护理/造型
      - 其他
      - 身体护理
      - 口腔护理
      - 卫生巾/经期用品
    profile_dir: runtime/taobao-browser-profile
    # 与已成功人工登录的工作树使用相同原型 getter 初始化方式。
    webdriver_compatibility: true
    # 会话 Cookie 只备份在本机独立 Profile 内，不进入采集数据或通知。
    persist_session_cookies: true
scheduler:
  timezone: Asia/Shanghai
  misfire_grace_minutes: 600
  cross_day_backfill: false
collection:
  request_interval_seconds:
    min: 0.5
    max: 1
  action_timeout_seconds: 30
  response_timeout_seconds: 45
  scroll_settle_seconds: 1.5
  manual_auth_wait_seconds: 180
  # 淘宝不使用页内重试；首轮后失败分类固定最多补采两轮。
  network_retry_attempts: 0
publication:
  web_primary_task_id: taobao_household_cleaning_realtime
database:
  url_env: TAOBAO_DATABASE_URL
retention:
  raw_response_days: 30
  failure_artifact_days: 10
  log_days: 10
  delete_database_records: false
  delete_exports: false
tasks:
  - id: taobao_household_cleaning_realtime
    platform: taobao
    enabled: true
    display_name: 淘宝洗护清洁实时榜
    schedule: "0 14 * * *"
    category_scope:
      mode: all_level1
      root_category_id: "50025705"
      additional_roots:
        # 家庭/个人清洁工具：只追加截图中的三个二级分支。
        - root_category_id: "50016348"
          level2_category_ids:
            - "2132"      # 卫浴/置物用具
            - "50003949"  # 家务/地板清洁用具
            - "50009146"  # 个人洗护清洁用具
      target_level: 3
      exclude_all: true
